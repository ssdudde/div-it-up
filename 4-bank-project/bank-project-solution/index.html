<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="style.css" >
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank App</title>
  </head>
  <body>
    <h1>Bank App</h1>
    <div id="app">Loading...</div>
    <template id="login">
        <section>
          <h2>Login</h2>
          <form id="loginForm" action="javascript:login()">
            <label for="username">Username</label><br>
            <input id="username" name="user" type="text"><br>
            <div id="loginError" role="alert"></div>
            <button>Login</button>
          </form>
          <hr class="hr-text" data-content="or">
          <h2>Register</h2>
          <form id="registerForm" action="javascript:register()">
            <label for="user">Username</label><br>
            <input id="user" name="user" type="text" maxlength="20" required><br>
            <label for="currency">Currency</label><br>
            <input id="currency" name="currency" type="text" value="$" maxlength="5" required><br>
            <label for="description">Description</label><br>
            <input id="description" name="description" type="text" maxlength="100"><br>
            <label for="balance">Current balance</label><br>
            <input id="balance" name="balance" type="number" value="0" maxlength="100"><br>
            <div id="registerError" role="alert"></div>
            <button>Register</button>
            <section>
              <a href="/credit" onclick="onLinkClick(event)">Credits</a>
            </section>
          </form>
          
        </section>
      </template>

      <template id="dashboard">
        <header>
          <h1>Bank App</h1>
          <a href="/login" onclick="onLinkClick(event)" id="logout">Logout</a>  
        </header>

        <section>
          Balance: <span id="balance"></span><span id="currency"></span>
          <h2 id="description"></h2>
        </section>

        <section>
          <h2>Transactions</h2>
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Object</th>
                <th>Amount</th>
              </tr>
            </thead>
            <tbody id="transactions"></tbody>
          </table>
          <button id="Btrans" type="submit">ADD TRANSACTIONS</button>
          <dialog id="DTrans">
                <form id="AddTrans" >
                  <label for="date">Date</label><br>
                  <input id="date" name="date" type="date" required><br>
                  <label for="object">Object</label><br>
                  <input id="object" name="object" type="text" required><br>
                  <label for="amount">Amount(Use negative value for debt)</label><br>
                  <input id="amount" name="amount" type="number" required><br>
                  <button id="cancel">CANCEL</button>
                  <button id="ok">OK</button>
                </form>
          </dialog>

        </section>
      </template>
      
      <template id="credit">
        <h1>CREDITS:</h1>
        <p>AMFOSS</p>
        <a href="/login" onclick="onLinkClick(event)">Go back</a>
      </template>

      <template id="transaction">
              <tr>
                  <th></th>
                  <th></th>
                  <th></th>
              </tr>
                    
      </template>
    <script src="app.js" defer></script>  
  </body>
</html>
